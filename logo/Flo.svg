<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 500 500" width="100%" height="100%">
  <!-- Transparent background, pure black paths (change fill to "#ffffff" for dark mode) -->
  <g fill="#111111" transform="rotate(-25 250 210)">
    <!-- Left Half of Coffee Bean -->
    <path d="M 230 70
             C 140 75, 100 150, 100 230
             C 100 310, 150 375, 230 380
             C 220 330, 205 270, 225 230
             C 240 195, 245 140, 230 70 Z" />

    <!-- Right Half of Coffee Bean -->
    <path d="M 270 70
             C 255 140, 260 195, 275 230
             C 295 270, 280 330, 270 380
             C 350 375, 400 310, 400 230
             C 400 150, 360 75, 270 70 Z" />
  </g>

  <!-- Typography -->
  <text x="250" y="420"
        font-family="'Playfair Display', 'Didot', 'Georgia', serif"
        font-size="36"
        font-weight="bold"
        letter-spacing="10"
        fill="#111111"
        text-anchor="middle">AROMATIC</text>

  <text x="250" y="445"
        font-family="'Montserrat', 'Arial', sans-serif"
        font-size="12"
        font-weight="500"
        letter-spacing="5"
        fill="#555555"
        text-anchor="middle">CAFE</text>
</svg>
